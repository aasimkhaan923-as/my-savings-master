<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hisab Kitaab — Shared Family Account</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="home-card">
      <div class="logo">💰</div>
      <h1>Hisab Kitaab</h1>
      <p class="tagline">Shared family account — live for everyone</p>

      <div id="firebase-warning" class="warning hidden">Firebase not connected.</div>

      <label>Your name</label>
      <input id="inp-name" type="text" maxlength="20" placeholder="e.g. Ahmed" />

      <button id="btn-create" class="btn primary">Create Room</button>

      <div class="divider"><span>OR</span></div>

      <label>Room code</label>
      <input id="inp-code" type="number" inputmode="numeric" placeholder="5-digit code" />
      <button id="btn-join" class="btn secondary">Join Room</button>
    </div>
  </div>

  <!-- ROOM SCREEN -->
  <div id="screen-room" class="screen">
    <header class="topbar">
      <div>
        <div class="room-code" id="room-code">----</div>
        <div class="room-sub">Shared family account</div>
      </div>
      <div class="top-actions">
        <button id="btn-theme" class="icon-btn" title="Theme">🌓</button>
        <button id="btn-share" class="icon-btn" title="Share code">🔗</button>
        <button id="btn-leave" class="icon-btn" title="Leave">🚪</button>
      </div>
    </header>

    <section class="cards">
      <div class="card income"><small>Income</small><strong id="sum-income">Rs 0</strong></div>
      <div class="card expense"><small>Expense</small><strong id="sum-expense">Rs 0</strong></div>
      <div class="card balance"><small>Balance</small><strong id="sum-balance">Rs 0</strong></div>
    </section>

    <section class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="today">Today</button>
      <button class="chip" data-filter="month">This Month</button>
      <button id="btn-pdf" class="chip pdf">PDF ⬇</button>
    </section>

    <section id="members-bar" class="members-bar"></section>

    <section id="entries" class="entries"></section>

    <button id="btn-add" class="fab">＋</button>
  </div>

  <!-- ADD ENTRY MODAL -->
  <div id="modal-add" class="modal hidden">
    <div class="modal-card">
      <h3>Add Entry</h3>
      <div class="type-toggle">
        <button id="type-expense" class="type-btn active">Expense</button>
        <button id="type-income" class="type-btn">Income</button>
      </div>
      <label>Amount (Rs)</label>
      <input id="inp-amount" type="number" inputmode="numeric" placeholder="0" />
      <label>Category</label>
      <select id="inp-category"></select>
      <label>Note (optional)</label>
      <input id="inp-note" type="text" maxlength="60" placeholder="e.g. Grocery from store" />
      <div class="modal-actions">
        <button id="btn-cancel" class="btn secondary">Cancel</button>
        <button id="btn-save" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="firebase.js"></script>
  <script src="app.js"></script>
</body>
</html>
