<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب کتاب - Daily Budget</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        
        h2 { text-align: center; color: #1e293b; margin: 0 0 15px 0; font-size: 1.5rem; }
        
        /* Summary Cards */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .card { padding: 12px 8px; border-radius: 10px; text-align: center; color: white; }
        .card-balance { background: #2563eb; }
        .card-income { background: #16a34a; }
        .card-expense { background: #dc2626; }
        .card span { display: block; font-size: 0.75rem; opacity: 0.9; }
        .card strong { font-size: 1.1rem; display: block; margin-top: 4px; }

        /* Form Controls */
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #475569; font-weight: 600; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .btn-income { background-color: #16a34a; }
        .btn-expense { background-color: #dc2626; }
        button:active { transform: scale(0.98); }

        /* History List */
        .history-title { font-size: 1.1rem; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 10px; }
        .history-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; }
        .item-income { border-right: 4px solid #16a34a; }
        .item-expense { border-right: 4px solid #dc2626; }
        
        .item-details { display: flex; flex-direction: column; gap: 2px; }
        .item-desc { font-weight: 600; font-size: 0.95rem; color: #0f172a; }
        .item-meta { font-size: 0.75rem; color: #64748b; }
        .tag { background: #e2e8f0; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }

        .item-amount-delete { display: flex; align-items: center; gap: 10px; }
        .amount { font-weight: bold; font-size: 1rem; }
        .amount-income { color: #16a34a; }
        .amount-expense { color: #dc2626; }
        
        .btn-del { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; padding: 2px 6px; }
        .btn-del:hover { color: #dc2626; }
    </style>


    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBHpBbHUqTR-q1MdxJEzguJIkuixkxVLBI",
            authDomain: "hisaabkitaab-13d52.firebaseapp.com",
            databaseURL: "https://hisaabkitaab-13d52-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hisaabkitaab-13d52",
            storageBucket: "hisaabkitaab-13d52.firebasestorage.app",
            messagingSenderId: "194563862363",
            appId: "1:194563862363:web:536f2deae7dda9358cf47e",
            measurementId: "G-Y07XTW1ZH2"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const transactionsRef = ref(database, 'transactions');

        // UI Elements
        const balanceEl = document.getElementById('total-balance');
        const incomeEl = document.getElementById('total-income');
        const expenseEl = document.getElementById('total-expense');
        const historyListEl = document.getElementById('history-list');

        // Add Transaction
        window.addTransaction = function(type) {
            const user = document.getElementById('user-name').value;
            const category = document.getElementById('category').value;
            const desc = document.getElementById('description').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            if (!desc || isNaN(amount) || amount <= 0) {
                alert("براہ کرم تفصیل اور درست رقم درج کریں۔");
                return;
            }

            const newTransaction = {
                user: user,
                category: category,
                description: desc,
                amount: amount,
                type: type,
                date: new Date().toLocaleDateString('ur-PK'),
                timestamp: Date.now()
            };

            push(transactionsRef, newTransaction);

            // Clear Inputs
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
        };

        // Delete Transaction
        window.deleteTransaction = function(id) {
            if (confirm("کیا آپ واقعی یہ اینٹری ڈیلیٹ کرنا چاہتے ہیں؟")) {
                const itemRef = ref(database, `transactions/${id}`);
                remove(itemRef);
            }
        };

        // Realtime Data Sync
        onValue(transactionsRef, (snapshot) => {
            const data = snapshot.val();
            historyListEl.innerHTML = '';

            let totalBalance = 0;
            let totalIncome = 0;
            let totalExpense = 0;

            if (data) {
                const entries = Object.entries(data);
                entries.sort((a, b) => b[1].timestamp - a[1].timestamp);

                entries.forEach(([id, item]) => {
                    const isIncome = item.type === 'income';
                    
                    if (isIncome) {
                        totalIncome += item.amount;
                    } else {
                        totalExpense += item.amount;
                    }

                    const li = document.createElement('li');
                    li.className = `history-item ${isIncome ? 'item-income' : 'item-expense'}`;
                    
                    li.innerHTML = `
                        <div class="item-details">
                            <span class="item-desc">${item.description}</span>
                            <div class="item-meta">
                                <span class="tag">${item.user}</span>
                                <span class="tag">${item.category}</span>
                                <span>${item.date}</span>
                            </div>
                        </div>
                        <div class="item-amount-delete">
                            <span class="amount ${isIncome ? 'amount-income' : 'amount-expense'}">
                                ${isIncome ? '+' : '-'}${item.amount}
                            </span>
                            <button class="btn-del" onclick="deleteTransaction('${id}')" title="ڈیلیٹ کریں">✕</button>
                        </div>
                    `;
                    historyListEl.appendChild(li);
                });
            }

            totalBalance = totalIncome - totalExpense;

            balanceEl.textContent = `${totalBalance} Rs`;
            incomeEl.textContent = `${totalIncome} Rs`;
            expenseEl.textContent = `${totalExpense} Rs`;
        });
    </script>
</head>



  <body>

<div class="container">
    <h2>📖 روزانہ کا حساب کتاب</h2>
    
    <!-- Summary Cards -->
    <div class="summary-grid">
        <div class="card card-balance">
            <span>کل بقایا</span>
            <strong id="total-balance">0 Rs</strong>
        </div>
        <div class="card card-income">
            <span>کل آمدن</span>
            <strong id="total-income">0 Rs</strong>
        </div>
        <div class="card card-expense">
            <span>کل خرچہ</span>
            <strong id="total-expense">0 Rs</strong>
        </div>
    </div>

    <!-- User Input Fields -->
    <div class="form-group">
        <label>اینٹری کرنے والا (یوزر):</label>
        <select id="user-name">
            <option value="یوزر 1">یوزر 1</option>
            <option value="یوزر 2">یوزر 2</option>
            <option value="یوزر 3">یوزر 3</option>
        </select>
    </div>

    <div class="form-group">
        <label>زمرہ (Category):</label>
        <select id="category">
            <option value="⛽ پٹرول">⛽ پٹرول</option>
            <option value="🛒 راشن / گروسری">🛒 راشن / گروسری</option>
            <option value="⚡ بجلی/گیس/موبائل بل">⚡ بجلی/گیس/موبائل بل</option>
            <option value="🍕 کھانا / چائے">🍕 کھانا / چائے</option>
            <option value="🛍️ ذاتی خرچہ">🛍️ ذاتی خرچہ</option>
            <option value="💵 آمدن / ماہانہ رقم">💵 آمدن / ماہانہ رقم</option>
            <option value="📦 دیگر اخراجات">📦 دیگر اخراجات</option>
        </select>
    </div>
  



      <div class="form-group">
        <label>تفصیل / اینٹری:</label>
        <input type="text" id="description" placeholder="مثلاً: بائیک میں پٹرول ڈلوایا">
    </div>

    <div class="form-group">
        <label>رقم (Rs):</label>
        <input type="number" id="amount" placeholder="0">
    </div>

    <div class="btn-group">
        <button class="btn-income" onclick="addTransaction('income')">+ آمدن (Income)</button>
        <button class="btn-expense" onclick="addTransaction('expense')">- خرچہ (Expense)</button>
    </div>

    <!-- Live History Feed -->
    <h3 class="history-title">لائیو ہسٹری (Live Feed)</h3>
    <ul id="history-list" class="history-list">
        <!-- Live Data Updates Here -->
    </ul>
</div>

</body>
</html>
